name: Build, test and publish a target extension

on:
  workflow_call:
    inputs:
      extension_name:
        description: "The PostgreSQL extension to build (directory name)"
        required: true
        type: string

permissions: {}

jobs:
  testbuild:
    name: Build ${{ inputs.extension_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      metadata: ${{ steps.build.outputs.metadata }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'linux/arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/bake-action@v6
        id: build
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          environment: testing
          registry: ghcr.io/${{ github.repository_owner }}
          revision: ${{ github.sha }}
        with:
          files: ./${{ inputs.extension_name }}/metadata.hcl,./docker-bake.hcl
          push: true

  publish:
    name: Publish ${{ inputs.extension_name }} to production
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: testbuild
    permissions:
      packages: write
    steps:
      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote testing images to production
        env:
          BUILD_METADATA: ${{ needs.testbuild.outputs.metadata }}
        run: |
          # Extract all unique testing image tags and retag as production
          # Testing images use the suffix "-testing" in the image name, e.g.:
          #   ghcr.io/vshn/pg_repack-testing:1.5.3-18-bookworm
          #   ghcr.io/vshn/pg_repack:1.5.3-18-bookworm  (production)
          jq -r '[.[]["image.name"] | split(",")[]] | unique[]' <<< "$BUILD_METADATA" | \
            while read testing_tag; do
              prod_tag="${testing_tag/-testing:/:}"
              echo "Promoting ${testing_tag} -> ${prod_tag}"
              docker buildx imagetools create --tag "${prod_tag}" "${testing_tag}"
            done
