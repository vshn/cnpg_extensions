name: Build and Push Extensions

on:
  push:
  workflow_dispatch:
    inputs:
      extension:
        description: "Extension name (e.g., pg_repack)"
        required: true
        default: pg_repack
      pg_version:
        description: "PostgreSQL major version (e.g., 18)"
        required: true
        default: "18"
      ext_version:
        description: "Extension version (e.g., 1.5.3)"
        required: true
        default: 1.5.3

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      push: ${{ steps.generate.outputs.push }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate matrix
        id: generate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            matrix=$(jq -n \
              --arg ext "${{ github.event.inputs.extension }}" \
              --arg pg  "${{ github.event.inputs.pg_version }}" \
              --arg ver "${{ github.event.inputs.ext_version }}" \
              '[{ extension: $ext, pg_version: $pg, ext_version: $ver }]')
          else
            matrix=$(python3 -c "
          import json, yaml
          from itertools import product
          with open('builds.yaml') as f:
              data = yaml.safe_load(f)
          matrix = [
              {'extension': ext['extension'], 'pg_version': pg, 'ext_version': ver}
              for ext in data
              for pg, ver in product(ext['pg_versions'], ext['ext_versions'])
          ]
          print(json.dumps(matrix))
          ")
          fi
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"
          # Only push on main branch or manual dispatch, not on PRs
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: needs.setup.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.extension }}/Dockerfile
          build-args: |
            PG_VERSION=${{ matrix.pg_version }}
            EXT_VERSION=${{ matrix.ext_version }}
          push: ${{ needs.setup.outputs.push == 'true' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.extension }}:pg${{ matrix.pg_version }}-${{ matrix.ext_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
